<svg width="1000" height="270" viewBox="0 0 1000 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; fill: #f5f5f0; }
      .num { font-size: 68px; font-weight: bold; fill: #ffffff; }
      .label { font-size: 20px; letter-spacing: 4px; fill: #ffffff; }
      .path { font-size: 13px; letter-spacing: 1px; fill: #8b8f98; }
      .rule { stroke: #f5f5f0; stroke-opacity: 0.35; stroke-width: 1; }
      .body { font-size: 17px; fill: #d7dae0; }
    </style>
  </defs>
 
  <rect width="1000" height="270" fill="#0a0e14" />
 
  <!-- section header -->
  <text x="40" y="82" class="num">01</text>
  <text x="140" y="72" class="label">WHOAMI</text>
  <line x1="330" y1="62" x2="840" y2="62" class="rule" />
  <text x="960" y="67" text-anchor="end" class="path">~/01-whoami</text>
 
  <!-- body -->
  <text x="40" y="160" class="body">final-year Data Science student at FER. I build production LLM agents and multi-agent systems</text>
  <text x="40" y="190" class="body">that actually work in the real world — mostly Google ADK, Gemini, and fast RAG pipelines.</text>
  <text x="40" y="220" class="body">I like solving the messy problems that happen when AI meets real users at scale.</text>
</svg>
 
