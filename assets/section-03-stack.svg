<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; fill: #f5f5f0; }
      .num { font-size: 60px; font-weight: bold; fill: #ffffff; }
      .label-head { font-size: 18px; letter-spacing: 4px; fill: #ffffff; }
      .path { font-size: 13px; letter-spacing: 1px; fill: #8b8f98; }
      .rule { stroke: #f5f5f0; stroke-opacity: 0.32; stroke-width: 1; }
      .divider { stroke: #f5f5f0; stroke-opacity: 0.35; stroke-width: 1; }
      .row-label { font-size: 14px; letter-spacing: 2px; fill: #9a9ea6; }
      .row-value { font-size: 19px; fill: #f0f2f5; }
      .status-label { font-size: 15px; letter-spacing: 2px; fill: #ffffff; }
      .status-sub { font-size: 13px; fill: #8b8f98; }
      .meta { font-size: 15px; fill: #d7dae0; }
      .dot { fill: #39d353; }
    </style>
  </defs>

  <rect width="1000" height="580" fill="#0a0e14" />

  <!-- section header -->
  <text x="40" y="72" class="num">03</text>
  <text x="125" y="62" class="label-head">STACK</text>
  <line x1="290" y1="52" x2="880" y2="52" class="rule" />
  <text x="960" y="57" text-anchor="end" class="path">~/03-stack</text>

  <!-- vertical divider -->
  <line x1="165" y1="135" x2="165" y2="460" class="divider" />

  <!-- rows -->
  <text x="40" y="153" class="row-label">LANGUAGES</text>
  <text x="195" y="158" class="row-value">Python · TypeScript · JavaScript · C · SQL</text>

  <text x="40" y="201" class="row-label">AI &amp; AGENTS</text>
  <text x="195" y="206" class="row-value">LangChain · LangGraph · Google ADK · RAG · Vector Search</text>

  <text x="40" y="249" class="row-label">CLOUD</text>
  <text x="195" y="254" class="row-value">GCP · Cloud Run · Vertex AI Agent Engine · Docker · Kubernetes</text>

  <text x="40" y="297" class="row-label">DATA</text>
  <text x="195" y="302" class="row-value">AlloyDB · PostgreSQL · ChromaDB · MySQL</text>

  <text x="40" y="345" class="row-label">WEB</text>
  <text x="195" y="350" class="row-value">React · Next.js · Flask · FastAPI</text>

  <text x="40" y="393" class="row-label">INFRA</text>
  <text x="195" y="398" class="row-value">MCP servers · Pub/Sub · CI/CD · Cloud Build</text>

  <text x="40" y="441" class="row-label">TOOLING</text>
  <text x="195" y="446" class="row-value">Git · Claude Code · GitHub · Postman</text>

  <line x1="40" y1="490" x2="960" y2="490" class="rule" />

  <!-- footer -->
  <circle cx="52" cy="527" r="5" class="dot">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="70" y="533" class="status-label">STATUS — SHIPPING</text>
  <text x="70" y="558" class="status-sub">probably debugging an agent, probably past midnight</text>

  <text x="960" y="533" text-anchor="end" class="meta">antoniosimic.online · Zagreb, HR · © 2026</text>
</svg>
